services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: solo
      POSTGRES_USER: solo
      POSTGRES_PASSWORD: solo
    ports:
      - "5432:5432"
    volumes:
      - solo-postgres:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo -d solo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://solo:solo@postgres:5432/solo
      REDIS_URL: redis://redis:6379/0
      GEODB_RAPIDAPI_KEY: ${GEODB_RAPIDAPI_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    ports:
      - "45655:45655"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:45655
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  solo-postgres:

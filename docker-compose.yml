services:
  postgres:
    profiles:
      - local-db
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: solo
      POSTGRES_USER: solo
      POSTGRES_PASSWORD: solo
    ports:
      - "5432:5432"
    volumes:
      - solo-postgres:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo -d solo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles:
      - local-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - path: ./.env.local
        required: false
    ports:
      - "45655:45655"

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - path: ./.env.local
        required: false
      - path: ./.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:45655
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  solo-postgres:
